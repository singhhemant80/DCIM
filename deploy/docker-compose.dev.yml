# Development services only. Production runs PostgreSQL and Redis natively (see docs/development.md).
services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: cdcim
      POSTGRES_PASSWORD: cdcim_dev
      POSTGRES_DB: crapplet_dcim
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./dev-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cdcim"], interval: 5s, retries: 10 }
  redis:
    image: redis:7.2-alpine
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
