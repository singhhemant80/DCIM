# /etc/nginx/sites-available/crapplet-dcim.conf
# Serves the SPA and proxies /api to the API on loopback. TLS certificates via certbot or your CA.
server {
    listen 80;
    listen [::]:80;
    server_name dcim.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dcim.example.com;

    ssl_certificate     /etc/letsencrypt/live/dcim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dcim.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The sha256 value allows the small inline theme script in index.html; recompute it if that script changes:
    #   python3 deploy/csp-hash.py apps/web/dist/index.html
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-hnBIHvN2ja2ATGakvKjFi1cr5cLb6hmu5myF3lOKNJI='; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 2m;
    root /opt/crapplet-dcim/current/apps/web/dist;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (Phase 4): no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
